name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The same scans the push workflow runs, on the commit about to be published.
  # A gate that publishes has to clear the bar the gate that does not already
  # clears, or the bar is decorative.
  guards:
    uses: ./.github/workflows/guards.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      language-excludes: "--exclude=i18n.js"

  draft:
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      # Installers named after one version and downloaded from another is the
      # kind of mistake nobody catches until somebody reports a bug against a
      # build that does not exist.
      - name: The tag, the manifest and the changelog must agree
        shell: bash
        run: |
          version="${TAG#v}"
          declared=$(grep -m1 '^version *= *"' pyproject.toml | cut -d'"' -f2)
          echo "tag $version, pyproject $declared"
          if [ "$version" != "$declared" ]; then
            echo "::error::the tag says $version and pyproject.toml says $declared"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Create or reuse the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # Written notes, not generated ones. A list of commit subjects tells a
          # reader what was typed, never what changed for them.
          body=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has a heading for $version but nothing under it"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "DriveFerry $TAG" --notes "$body"
          else
            gh release edit "$TAG" --notes "$body"
          fi

  build:
    needs: draft
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows x64, asset: DriveFerry-windows-x64.exe }
          - { os: macos-latest, label: macOS Apple Silicon, asset: DriveFerry-macos-arm64.zip }
          - { os: macos-15-intel, label: macOS Intel, asset: DriveFerry-macos-x64.zip }
          - { os: ubuntu-22.04, label: Linux x64, asset: DriveFerry-linux-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pywebview draws through the system webview: WebKitGTK on Linux, and
      # PyInstaller needs those bindings present at build time.
      - name: System webview (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.0 \
                                  python3-gi python3-gi-cairo

      - run: pip install pyinstaller pywebview

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed --clean
          --name DriveFerry
          --icon docs/icon.ico
          --add-data "driveferry/web;driveferry/web"
          run.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --onefile --clean
          --name DriveFerry
          --add-data "driveferry/web:driveferry/web"
          run.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --windowed --clean
          --name DriveFerry
          --icon docs/icon.icns
          --add-data "driveferry/web:driveferry/web"
          run.py

      - name: Package the asset
        shell: bash
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/DriveFerry.exe "out/${{ matrix.asset }}" ;;
            Linux)   cp dist/DriveFerry "out/${{ matrix.asset }}" ;;
            macOS)   (cd dist && zip -qry "../out/${{ matrix.asset }}" DriveFerry.app) ;;
          esac
          ls -l out

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "out/${{ matrix.asset }}" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Published alongside the installers so anyone downloading one can check
      # they got the file this workflow produced, and not something a mirror or
      # a hijacked link handed them instead.
      - name: Checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sums && cd sums
          gh release download "$TAG" --pattern "DriveFerry-*" --clobber
          sha256sum DriveFerry-* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest
