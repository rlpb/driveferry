<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="DriveFerry: move folders between Google Drive accounts">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F8FB"/>
      <stop offset="1" stop-color="#EDEFF5"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0060DF"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0B1B3A" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#007AFF" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#sky)"/>

  <!-- left panel: source account -->
  <g filter="url(#lift)">
    <rect x="118" y="150" width="392" height="300" rx="22" fill="#FFFFFF"/>
    <rect x="118" y="150" width="392" height="52" rx="22" fill="#F4F5F8"/>
    <rect x="118" y="186" width="392" height="16" fill="#F4F5F8"/>
    <circle cx="150" cy="176" r="5" fill="#D3D6DE"/>
    <rect x="168" y="170" width="128" height="12" rx="6" fill="#D3D6DE"/>
    <g fill="none" stroke="#007AFF" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M152 236h20l8 9h34a7 7 0 0 1 7 7v34a7 7 0 0 1-7 7h-62a7 7 0 0 1-7-7v-43a7 7 0 0 1 7-7z"/>
      <path d="M152 320h20l8 9h34a7 7 0 0 1 7 7v34a7 7 0 0 1-7 7h-62a7 7 0 0 1-7-7v-43a7 7 0 0 1 7-7z"/>
    </g>
    <rect x="248" y="252" width="176" height="13" rx="6.5" fill="#20232B"/>
    <rect x="248" y="278" width="112" height="11" rx="5.5" fill="#C9CCD5"/>
    <rect x="248" y="336" width="150" height="13" rx="6.5" fill="#20232B"/>
    <rect x="248" y="362" width="94" height="11" rx="5.5" fill="#C9CCD5"/>
  </g>

  <!-- right panel: destination account -->
  <g filter="url(#lift)">
    <rect x="770" y="150" width="392" height="300" rx="22" fill="#FFFFFF"/>
    <rect x="770" y="150" width="392" height="52" rx="22" fill="#F4F5F8"/>
    <rect x="770" y="186" width="392" height="16" fill="#F4F5F8"/>
    <circle cx="802" cy="176" r="5" fill="#D3D6DE"/>
    <rect x="820" y="170" width="112" height="12" rx="6" fill="#D3D6DE"/>
    <g fill="none" stroke="#34C759" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M804 236h20l8 9h34a7 7 0 0 1 7 7v34a7 7 0 0 1-7 7h-62a7 7 0 0 1-7-7v-43a7 7 0 0 1 7-7z"/>
      <path d="M804 320h20l8 9h34a7 7 0 0 1 7 7v34a7 7 0 0 1-7 7h-62a7 7 0 0 1-7-7v-43a7 7 0 0 1 7-7z"/>
    </g>
    <rect x="900" y="252" width="176" height="13" rx="6.5" fill="#20232B"/>
    <rect x="900" y="278" width="112" height="11" rx="5.5" fill="#C9CCD5"/>
    <rect x="900" y="336" width="150" height="13" rx="6.5" fill="#20232B"/>
    <rect x="900" y="362" width="94" height="11" rx="5.5" fill="#C9CCD5"/>
  </g>

  <!-- the crossing -->
  <g filter="url(#glow)">
    <circle cx="640" cy="300" r="52" fill="url(#badge)"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M618 300h40"/>
    <path d="m648 288 12 12-12 12"/>
  </g>
  <g fill="none" stroke="#B9C3D6" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16">
    <path d="M528 300h44"/>
    <path d="M708 300h44"/>
  </g>

  <!-- wordmark -->
  <g fill="none" stroke="#007AFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(487 494) scale(2.05)">
    <path d="M3.5 15.5 5 10.2a1.6 1.6 0 0 1 1.6-1.2h10.8a1.6 1.6 0 0 1 1.6 1.2l1.5 5.3"/>
    <path d="M12 3v6"/>
    <path d="M2.5 19.2c1.6 0 1.6 1.3 3.2 1.3s1.6-1.3 3.2-1.3 1.6 1.3 3.1 1.3 1.6-1.3 3.2-1.3 1.6 1.3 3.2 1.3 1.6-1.3 3.1-1.3"/>
  </g>
  <text x="551" y="531" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="600" letter-spacing="-1" fill="#12141A">DriveFerry</text>
  <text x="640" y="574" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="400" fill="#6A6E78">Move folders between Google Drive accounts</text>
</svg>
