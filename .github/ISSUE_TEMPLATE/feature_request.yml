name: Feature request
description: Suggest something DriveFerry should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like DriveFerry to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: The rclone command, the manual steps, or the other tool.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not make deleting data faster or need fewer confirmations.
          required: true
