[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driveferry"
version = "0.4.0"
description = "Move files and folders between Google Drive accounts, visually. A native desktop window on top of rclone."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "google-drive", "gdrive", "rclone", "file-transfer", "cloud-migration",
    "move-files", "backup", "gui", "desktop-app", "cross-platform",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = ["pywebview>=4.4"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
driveferry = "driveferry.app:main"

[project.urls]
Homepage = "https://github.com/rlpb/driveferry"
Source = "https://github.com/rlpb/driveferry"
Issues = "https://github.com/rlpb/driveferry/issues"
Changelog = "https://github.com/rlpb/driveferry/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["driveferry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["UP032", "UP031", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
