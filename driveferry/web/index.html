<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DriveFerry</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body data-token="__DRIVEFERRY_TOKEN__" data-platform="__DRIVEFERRY_PLATFORM__">

<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
  <symbol id="i-folder" viewBox="0 0 24 24">
    <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.4a2 2 0 0 1 1.5.7l1 1.2h7.1A2.5 2.5 0 0 1 21 9.4v7.1a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/>
  </symbol>
  <symbol id="i-file" viewBox="0 0 24 24">
    <path d="M13.5 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8.5z"/>
    <path d="M13.5 3v4a1.5 1.5 0 0 0 1.5 1.5h4"/>
  </symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24">
    <path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 0 8h-1"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 4v7h-7"/>
  </symbol>
  <symbol id="i-newfolder" viewBox="0 0 24 24">
    <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.4a2 2 0 0 1 1.5.7l1 1.2h7.1A2.5 2.5 0 0 1 21 9.4v7.1a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/>
    <path d="M12 11v5"/><path d="M9.5 13.5h5"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24">
    <path d="M12 3.8 2.8 19.5h18.4z"/><path d="M12 9.5v4.2"/><path d="M12 17h.01"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12"/><path d="M18 6 6 18"/></symbol>
  <symbol id="i-ferry" viewBox="0 0 24 24">
    <path d="M3.5 15.5 5 10.2a1.6 1.6 0 0 1 1.6-1.2h10.8a1.6 1.6 0 0 1 1.6 1.2l1.5 5.3"/>
    <path d="M12 3v6"/>
    <path d="M2.5 19.2c1.6 0 1.6 1.3 3.2 1.3s1.6-1.3 3.2-1.3 1.6 1.3 3.1 1.3 1.6-1.3 3.2-1.3 1.6 1.3 3.2 1.3 1.6-1.3 3.1-1.3"/>
  </symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24">
    <path d="M7 18.5a4 4 0 0 1-.4-8 5.5 5.5 0 0 1 10.6-1.2A3.9 3.9 0 0 1 17.5 18.5z"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3.1"/>
    <path d="M19.4 14.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-3-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-3l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.6 1.5z"/>
  </symbol>
  <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-maximize" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="2.5"/></symbol>
</svg>

<header class="titlebar">
  <div class="tb-lights" id="tb-lights">
    <button type="button" class="light light-close" data-window="close" aria-label="Close"></button>
    <button type="button" class="light light-min" data-window="minimize" aria-label="Minimise"></button>
    <button type="button" class="light light-zoom" data-window="maximize" aria-label="Zoom"></button>
  </div>

  <div class="brand pywebview-drag-region">
    <svg class="brand-mark" aria-hidden="true"><use href="#i-ferry"/></svg>
    <span class="brand-name">DriveFerry</span>
  </div>

  <div class="tb-drag pywebview-drag-region"></div>

  <div class="segmented" role="radiogroup" aria-label="Transfer mode">
    <button type="button" class="seg is-active" role="radio" aria-checked="true" data-mode="copy" data-i18n="mode.copy">Copy</button>
    <button type="button" class="seg" role="radio" aria-checked="false" data-mode="move" data-i18n="mode.move">Move</button>
  </div>

  <div class="tb-drag pywebview-drag-region"></div>

  <div class="titlebar-options">
    <label class="switch">
      <input type="checkbox" id="opt-dry">
      <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
      <span class="switch-label" data-i18n="opt.dryRun">Dry run</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="opt-serverside" checked>
      <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
      <span class="switch-label" data-i18n="opt.serverSide">Server-side</span>
    </label>
    <button type="button" class="icon-btn" id="settings-btn" data-i18n-aria="settings.title" aria-label="Settings">
      <svg aria-hidden="true"><use href="#i-gear"/></svg>
    </button>
  </div>

  <div class="tb-controls" id="tb-controls">
    <button type="button" class="tb-ctl" data-window="minimize" data-i18n-aria="window.minimize" aria-label="Minimise">
      <svg aria-hidden="true"><use href="#i-minimize"/></svg>
    </button>
    <button type="button" class="tb-ctl" data-window="maximize" data-i18n-aria="window.maximize" aria-label="Maximise">
      <svg aria-hidden="true"><use href="#i-maximize"/></svg>
    </button>
    <button type="button" class="tb-ctl tb-ctl-close" data-window="close" data-i18n-aria="window.close" aria-label="Close">
      <svg aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
</header>

<main class="panes" id="panes">
  <section class="pane" data-side="src" aria-label="Source">
    <header class="pane-head">
      <span class="pane-role" data-i18n="pane.from">From</span>
      <div class="select-wrap">
        <select class="account" data-role="account" data-i18n-aria="pane.sourceAccount" aria-label="Source account"></select>
        <svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </div>
      <button type="button" class="icon-btn" data-action="refresh" data-i18n-aria="action.refresh" aria-label="Refresh">
        <svg aria-hidden="true"><use href="#i-refresh"/></svg>
      </button>
      <button type="button" class="icon-btn" data-action="newfolder" data-i18n-aria="action.newFolder" aria-label="New folder">
        <svg aria-hidden="true"><use href="#i-newfolder"/></svg>
      </button>
    </header>
    <nav class="crumbs" data-role="crumbs" aria-label="Source path"></nav>
    <div class="storage" data-role="storage" hidden>
      <svg class="storage-bar" viewBox="0 0 100 4" preserveAspectRatio="none" aria-hidden="true">
        <rect class="storage-track" x="0" y="0" width="100" height="4" rx="2"/>
        <rect class="storage-fill" x="0" y="0" width="0" height="4" rx="2"/>
      </svg>
      <p class="storage-text" data-role="storage-text"></p>
    </div>
    <div class="list-wrap" data-role="drop">
      <ul class="filelist" data-role="list" role="listbox" aria-multiselectable="true" tabindex="0"></ul>
      <div class="empty" data-role="empty" hidden></div>
    </div>
    <footer class="pane-foot" data-role="foot"></footer>
  </section>

  <div class="transfer-column">
    <button type="button" class="swap-btn" id="swap" data-i18n-aria="action.swap" aria-label="Swap sides">
      <svg aria-hidden="true"><use href="#i-swap"/></svg>
    </button>
    <button type="button" class="go-btn" id="go" disabled aria-label="Transfer selected items">
      <svg class="go-icon" aria-hidden="true"><use href="#i-arrow"/></svg>
      <span class="go-count" id="go-count">0</span>
    </button>
    <p class="transfer-hint" id="transfer-hint"></p>
  </div>

  <section class="pane" data-side="dst" aria-label="Destination">
    <header class="pane-head">
      <span class="pane-role" data-i18n="pane.to">To</span>
      <div class="select-wrap">
        <select class="account" data-role="account" data-i18n-aria="pane.destinationAccount" aria-label="Destination account"></select>
        <svg class="select-chevron" aria-hidden="true"><use href="#i-chevron"/></svg>
      </div>
      <button type="button" class="icon-btn" data-action="refresh" data-i18n-aria="action.refresh" aria-label="Refresh">
        <svg aria-hidden="true"><use href="#i-refresh"/></svg>
      </button>
      <button type="button" class="icon-btn" data-action="newfolder" data-i18n-aria="action.newFolder" aria-label="New folder">
        <svg aria-hidden="true"><use href="#i-newfolder"/></svg>
      </button>
    </header>
    <nav class="crumbs" data-role="crumbs" aria-label="Destination path"></nav>
    <div class="storage" data-role="storage" hidden>
      <svg class="storage-bar" viewBox="0 0 100 4" preserveAspectRatio="none" aria-hidden="true">
        <rect class="storage-track" x="0" y="0" width="100" height="4" rx="2"/>
        <rect class="storage-fill" x="0" y="0" width="0" height="4" rx="2"/>
      </svg>
      <p class="storage-text" data-role="storage-text"></p>
    </div>
    <div class="list-wrap" data-role="drop">
      <ul class="filelist" data-role="list" role="listbox" aria-multiselectable="true" tabindex="0"></ul>
      <div class="empty" data-role="empty" hidden></div>
    </div>
    <footer class="pane-foot" data-role="foot"></footer>
  </section>
</main>

<footer class="statusbar">
  <span class="status-dot" id="status-dot" aria-hidden="true"></span>
  <span id="status-text"></span>
</footer>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <header class="sheet-head">
    <h2 class="sheet-title" id="sheet-title"></h2>
    <button type="button" class="icon-btn sheet-close" id="sheet-close" data-i18n-aria="action.close" aria-label="Close">
      <svg aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
  <footer class="sheet-foot" id="sheet-foot"></footer>
</section>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="/i18n.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
